.remain-badge{font-size:10px;padding:2px 7px;border-radius:10px;background:#FCEBEB;color:#A32D2D;}
.chev{font-size:11px;color:#aaa;transition:transform 0.2s;flex-shrink:0;margin-left:4px;}
.wb{display:none;border-top:1px solid #e0e0d8;}
.wb.open{display:block;}
.col-head{display:grid;grid-template-columns:1fr 44px;background:#f9f9f6;padding:5px 0;}
.col-head span{font-size:10px;color:#aaa;padding:0 12px;font-weight:600;}
.col-head .ch-head{text-align:center;}
.item-row{display:grid;grid-template-columns:1fr 44px;border-bottom:1px solid #f0f0ea;transition:background 0.15s;}
.item-row:last-child{border-bottom:none;}
.item-row.checked{background:#f0fbf6;}
.item-row.extra{background:#f7f6ff;}
.item-row.extra.checked{background:#f0fbf6;}
.cell{padding:9px 12px;font-size:12px;line-height:1.6;}
.subj{font-size:11px;font-weight:600;color:#333;display:block;margin-bottom:1px;}
.item-row.checked .subj{color:#0F6E56;}
.item-row.extra .subj{color:#3C3489;}
.item-row.extra.checked .subj{color:#0F6E56;}
.val{color:#555;font-size:12px;}
.item-row.checked .val{color:#0F6E56;text-decoration:line-through;opacity:0.6;}
.check-cell{display:flex;align-items:center;justify-content:center;padding:8px;}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid #ccc;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:all 0.15s;flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.ck.done{background:#1D9E75;border-color:#1D9E75;color:#fff;}
.notice{font-size:12px;color:#791F1F;background:#FCEBEB;padding:7px 12px;border-top:1px solid #f0e0e0;}

function getItems(d){
  const items=[...d.rows.map((r,i)=>({key:`${d.id}_r${i}`,s:r.s,v:r.v,extra:false}))];
  if(!d.kyukou&&!d.test){
    const kv=d.kanji?d.kanji:'今週の漢字テスト範囲';
    items.push({key:`${d.id}_kanji`,s:'漢字ノート',v:kv+'を練習',extra:true});
    items.push({key:`${d.id}_naoshi`,s:'なおしノート',v:'前回テスト・宿題の間違い直し',extra:true});
  }
  return items;
}

function tags(d){
  if(d.test) return '<span class="tg tt">統一テスト</span>';
  if(d.kyukou) return '<span class="tg ty">休講</span>';
  let h='';
  if(d.cats.includes('sansu')) h+='<span class="tg ts">算数</span>';
  if(d.cats.includes('kokugo')) h+='<span class="tg tk">国語</span>';
  return h;
}

function updateProgress(){
  let total=0,done=0;
  data.forEach(d=>getItems(d).forEach(it=>{total++;if(checks[it.key])done++;}));
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent=done+' / '+total+' 完了';
}

function updateHeader(d){
  const items=getItems(d);
  const allDone=items.length>0&&items.every(it=>checks[it.key]);
  const doneCnt=items.filter(it=>checks[it.key]).length;
  const wh=document.getElementById('wh-'+d.id);
  if(wh){allDone?wh.classList.add('all-done'):wh.classList.remove('all-done');}
  const badge=document.getElementById('badge-'+d.id);
  if(badge){
    if(allDone){badge.className='done-badge';badge.textContent='完了';}
    else if(doneCnt>0){badge.className='remain-badge';badge.textContent=(items.length-doneCnt)+'件残り';}
    else{badge.className='remain-badge';badge.textContent='未着手';}
  }
}

function toggleCheck(key,wid){
  checks[key]=!checks[key];
  save();
  const btn=document.getElementById('ck-'+key);
  if(btn){btn.classList.toggle('done',checks[key]);btn.textContent=checks[key]?'✓':'';}
  const row=document.getElementById('row-'+key);
  if(row)row.classList.toggle('checked',checks[key]);
  const d=data.find(x=>x.id===wid);
  if(d)updateHeader(d);
  updateProgress();
  if(currentFilter==='remaining')render(currentFilter);
}

let currentFilter='all';

function render(f){
  currentFilter=f;
  const c=document.getElementById('wc');
  c.innerHTML='';
  let lastMonth='';
  data.forEach(d=>{
    if(f==='sansu'&&!d.cats.includes('sansu'))return;
    if(f==='kokugo'&&!d.cats.includes('kokugo'))return;
    const items=getItems(d);
    if(f==='remaining'&&items.every(it=>checks[it.key]))return;
    const month=d.label.match(/^(\d+月)/)?.[1]||'';
    if(month&&month!==lastMonth&&f==='all'){
      const ml=document.createElement('div');
      ml.className='section-label';ml.textContent='── '+month;
      c.appendChild(ml);lastMonth=month;
    }
    const allDone=items.length>0&&items.every(it=>checks[it.key]);
    const doneCnt=items.filter(it=>checks[it.key]).length;
    let badgeHtml='';
    if(allDone)badgeHtml=`<span class="done-badge" id="badge-${d.id}">完了</span>`;
    else if(doneCnt>0)badgeHtml=`<span class="remain-badge" id="badge-${d.id}">${items.length-doneCnt}件残り</span>`;
    else badgeHtml=`<span class="remain-badge" id="badge-${d.id}">未着手</span>`;
    const rowsHtml=items.map(it=>`
      <div class="item-row${it.extra?' extra':''}${checks[it.key]?' checked':''}" id="row-${it.key}">
        <div class="cell"><span class="subj">${it.s}</span><span class="val">${it.v.replace(/\n/g,'<br>')}</span></div>
        <div class="check-cell">
          <div class="ck${checks[it.key]?' done':''}" id="ck-${it.key}" onclick="toggleCheck('${it.key}','${d.id}')">${checks[it.key]?'✓':''}</div>
        </div>
      </div>`).join('');
    const notice=d.notice?`<div class="notice">📌 ${d.notice}</div>`:'';
    const el=document.createElement('div');
    el.className='week';
    el.innerHTML=`
      <div class="wh${allDone?' all-done':''}" id="wh-${d.id}" onclick="tog('${d.id}')">
        <div class="wdate">${d.label}</div>
        <div class="wtags">${tags(d)}${badgeHtml}</div>
        <span class="chev" id="cv-${d.id}">▼</span>
      </div>
      <div class="wb" id="bd-${d.id}">
        <div class="col-head"><span>教材・内容</span><span class="ch-head">完了</span></div>
        ${rowsHtml}${notice}
      </div>`;
    c.appendChild(el);
  });
  updateProgress();
}

function tog(id){
  const b=document.getElementById('bd-'+id);
  const v=document.getElementById('cv-'+id);
  const o=b.classList.toggle('open');
  v.style.transform=o?'rotate(180deg)':'';
}

function fil(f,btn){
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render(f);
}

render('all');
